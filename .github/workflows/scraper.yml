name: Actualizar mascotas

on:
  schedule:
    # Todos los días a las 9:30 AM hora Argentina (UTC-3 = 12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:  # Permite correrlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sin dependencias: scraper_apify.py usa solo stdlib

      - name: Correr scraper vía Apify
        timeout-minutes: 20
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper_apify.py --max-posts 8

      - name: Commit y push cambios
        run: |
          git config user.name "PatitasBA Bot"
          git config user.email "bot@patitasba.com.ar"

          git pull --rebase origin main || true

          git add pets.json images/ || true
          git diff --staged --quiet || git commit -m "🐾 Actualización automática $(date +'%d/%m/%Y %H:%M')"
          git push || (echo "⚠️ Push falló, se reintenta..." && git pull --rebase origin main && git push)
